<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4"/>
  
  <!-- Terminal Prompt Symbol & ASCII Matrix Glyphs -->
  <g filter="url(#glow)">
    <text x="75" y="210" font-family="'Courier New', monospace" font-size="110" font-weight="900" fill="url(#accentGrad)">&gt;_</text>
    <text x="235" y="210" font-family="'Courier New', monospace" font-size="95" font-weight="700" fill="#ffffff">ASCII</text>
  </g>

  <!-- High-res dot/matrix decorative art below -->
  <g font-family="'Courier New', monospace" font-size="34" font-weight="bold" fill="#00f2fe" opacity="0.85">
    <text x="75" y="280"># % * + = - : .   0 1</text>
    <text x="75" y="325">@ &amp; 8 W M # * o a h k</text>
    <text x="75" y="370">█ ▓ ▒ ░   H D   A R T</text>
    <text x="75" y="415">&lt; A N D R O I D &gt;</text>
  </g>
</svg>
