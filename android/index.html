<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07080d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>ASCII Studio Android</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <style>
    :root {
      --bg: #07080d;
      --card: #11141e;
      --border: #23283a;
      --accent: #00e5ff;
      --accent2: #3b82f6;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      height: 100%;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(17, 20, 30, 0.9);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.3px;
    }
    .brand span.prompt {
      color: var(--accent);
      font-family: monospace;
      font-weight: 900;
    }
    .badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(0, 229, 255, 0.12);
      color: var(--accent);
      border: 1px solid rgba(0, 229, 255, 0.3);
    }
    .picker-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 14px 8px;
    }
    .btn-pick {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-pick.primary {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.16), rgba(59, 130, 246, 0.16));
      border-color: rgba(0, 229, 255, 0.45);
    }
    .btn-pick:active { transform: scale(0.97); }
    input[type="file"] { display: none; }

    .controls {
      margin: 4px 14px 10px;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }
    .ctrl-label { color: var(--muted); white-space: nowrap; }
    .ctrl-val { color: var(--accent); font-weight: 700; font-family: monospace; min-width: 48px; text-align: right; }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 6px;
    }
    .pills {
      display: flex;
      gap: 6px;
    }
    .pill {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0a0c12;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .pill.active {
      background: var(--accent);
      color: #050608;
      border-color: var(--accent);
    }

    .viewer {
      flex: 1;
      margin: 0 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #000000;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      min-height: 260px;
    }
    .placeholder {
      text-align: center;
      color: var(--muted);
      padding: 24px;
      font-size: 14px;
      line-height: 1.5;
    }
    .placeholder b { color: var(--text); }
    canvas#asciiCanvas {
      display: none;
      transform-origin: center center;
      image-rendering: pixelated;
    }
    .video-pill {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(15, 18, 28, 0.85);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
    }
    .video-pill button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 999px;
      padding: 4px 12px;
      font-weight: 700;
      font-size: 12px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px 14px 14px;
    }
    .btn-act {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 6px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }
    .btn-act:disabled { opacity: 0.4; pointer-events: none; }
    .btn-act:active { transform: scale(0.97); }

    .toast {
      position: fixed;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
      border: 1px solid var(--accent);
      z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="prompt">&gt;_</span> ASCII Studio</div>
    <div class="badge">Android</div>
  </header>

  <div class="picker-bar">
    <label class="btn-pick primary" for="cameraInput">📷 Сделать фото</label>
    <label class="btn-pick" for="galleryInput">🖼️ Фото / Видео</label>
    <input id="cameraInput" type="file" accept="image/*" capture="environment" />
    <input id="galleryInput" type="file" accept="image/*,video/*" />
  </div>

  <div class="controls">
    <div class="ctrl-row">
      <span class="ctrl-label">Разрешение:</span>
      <input id="colsRange" type="range" min="45" max="220" step="5" value="110" />
      <span id="colsVal" class="ctrl-val">110</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">Режим цвета:</span>
      <div class="pills">
        <button id="modeColor" class="pill active" type="button">Цветной</button>
        <button id="modeMono" class="pill" type="button">Монохром</button>
      </div>
    </div>
  </div>

  <div id="viewer" class="viewer">
    <div id="placeholder" class="placeholder">
      <b>Выберите фото, видео или сделайте снимок</b><br />
      Изображение отрисуется из букв, цифр и символов.<br />
      Масштабируйте двумя пальцами для просмотра деталей.
    </div>
    <canvas id="asciiCanvas"></canvas>
    <div id="videoControls" class="video-pill">
      <button id="videoToggleBtn" type="button">⏸ Пауза</button>
      <span id="videoInfo">Видео (без звука)</span>
    </div>
  </div>

  <div class="actions">
    <button id="saveBtn" class="btn-act" type="button" disabled>💾 Скачать PNG</button>
    <button id="copyBtn" class="btn-act" type="button" disabled>📋 Копировать</button>
    <button id="resetZoomBtn" class="btn-act" type="button" disabled>🔄 Сброс зума</button>
  </div>

  <div id="toast" class="toast">Готово</div>

  <script>
    const RAMP = " `.-':_,^=;><+!rc*z?sLTv)J7(|Fi{C}fI31tlu[neoZ5Yxjya]2ESwqkP6h9d4VpOGbUAKXHm8&%QW#NMD0$@";
    const CHAR_ASPECT = 0.52;

    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const colsRange = document.getElementById('colsRange');
    const colsVal = document.getElementById('colsVal');
    const modeColorBtn = document.getElementById('modeColor');
    const modeMonoBtn = document.getElementById('modeMono');
    const viewer = document.getElementById('viewer');
    const placeholder = document.getElementById('placeholder');
    const asciiCanvas = document.getElementById('asciiCanvas');
    const ctx = asciiCanvas.getContext('2d', { alpha: false });
    const videoControls = document.getElementById('videoControls');
    const videoToggleBtn = document.getElementById('videoToggleBtn');
    const saveBtn = document.getElementById('saveBtn');
    const copyBtn = document.getElementById('copyBtn');
    const resetZoomBtn = document.getElementById('resetZoomBtn');
    const toastEl = document.getElementById('toast');

    const offscreen = document.createElement('canvas');
    const offCtx = offscreen.getContext('2d', { willReadFrequently: true });

    let colorMode = 'color';
    let currentImg = null;
    let videoEl = null;
    let videoObjectUrl = null;
    let rafId = null;
    let lastAsciiText = '';

    // Состояние масштабирования и перемещения (pinch-to-zoom & pan)
    let scale = 1, panX = 0, panY = 0;
    let startDist = 0, startScale = 1;
    let isDragging = false, lastX = 0, lastY = 0, lastTap = 0;

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    function applyTransform() {
      asciiCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function fitCanvasToViewer() {
      scale = 1;
      panX = 0;
      panY = 0;
      const vw = viewer.clientWidth - 12;
      const vh = viewer.clientHeight - 12;
      if (asciiCanvas.width > 0 && asciiCanvas.height > 0 && vw > 0 && vh > 0) {
        const fit = Math.min(vw / asciiCanvas.width, vh / asciiCanvas.height);
        asciiCanvas.style.width = `${Math.floor(asciiCanvas.width * fit)}px`;
        asciiCanvas.style.height = `${Math.floor(asciiCanvas.height * fit)}px`;
      }
      applyTransform();
    }

    function renderFrameToAscii(source, srcW, srcH, isVideo = false) {
      const cols = parseInt(colsRange.value, 10);
      const aspect = srcH / Math.max(1, srcW);
      const rows = Math.max(1, Math.round(cols * aspect * CHAR_ASPECT));

      offscreen.width = cols;
      offscreen.height = rows;
      offCtx.drawImage(source, 0, 0, cols, rows);
      const data = offCtx.getImageData(0, 0, cols, rows).data;

      // Размер ячейки для чёткой отрисовки символов на мобильном экране
      const fontSize = isVideo ? 10 : 12;
      const cellW = fontSize * 0.6;
      const cellH = fontSize * 1.15;

      const targetW = Math.ceil(cols * cellW);
      const targetH = Math.ceil(rows * cellH);
      const sizeChanged = (asciiCanvas.width !== targetW || asciiCanvas.height !== targetH);
      if (sizeChanged) {
        asciiCanvas.width = targetW;
        asciiCanvas.height = targetH;
        fitCanvasToViewer();
      }

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, targetW, targetH);
      ctx.font = `bold ${fontSize}px "Courier New", Consolas, monospace`;
      ctx.textBaseline = 'top';

      const textRows = isVideo ? null : [];
      const rampMax = RAMP.length - 1;
      let lastColor = '';

      if (colorMode === 'mono') {
        ctx.fillStyle = '#e2e8f0';
      }

      for (let y = 0; y < rows; y++) {
        let line = isVideo ? null : '';
        const py = y * cellH;
        for (let x = 0; x < cols; x++) {
          const i = (y * cols + x) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255.0;
          const gamma = Math.pow(lum, 0.85);
          const ch = RAMP[Math.min(rampMax, Math.max(0, Math.round(gamma * rampMax)))];

          if (textRows) line += ch;
          if (ch === ' ') continue;

          if (colorMode === 'color') {
            // Квантование для снижения смены fillStyle на видео/фото
            const qr = r & 0xFC, qg = g & 0xFC, qb = b & 0xFC;
            const c = `rgb(${qr},${qg},${qb})`;
            if (c !== lastColor) {
              ctx.fillStyle = c;
              lastColor = c;
            }
          }
          ctx.fillText(ch, x * cellW, py);
        }
        if (textRows) textRows.push(line);
      }

      if (textRows) {
        lastAsciiText = textRows.join('\n');
      }
    }

    function stopActiveVideo() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      if (videoEl) {
        videoEl.pause();
        videoEl.removeAttribute('src');
        videoEl.load();
        videoEl = null;
      }
      if (videoObjectUrl) {
        URL.revokeObjectURL(videoObjectUrl);
        videoObjectUrl = null;
      }
      videoControls.style.display = 'none';
    }

    function enableOutputs() {
      placeholder.style.display = 'none';
      asciiCanvas.style.display = 'block';
      saveBtn.disabled = false;
      copyBtn.disabled = false;
      resetZoomBtn.disabled = false;
    }

    function handleFile(file) {
      if (!file) return;
      stopActiveVideo();
      currentImg = null;

      if (file.type.startsWith('video/')) {
        videoEl = document.createElement('video');
        videoEl.muted = true; // Без звука на Android
        videoEl.volume = 0;
        videoEl.playsInline = true;
        videoEl.loop = true;
        videoObjectUrl = URL.createObjectURL(file);
        videoEl.src = videoObjectUrl;

        videoEl.addEventListener('loadeddata', () => {
          enableOutputs();
          videoControls.style.display = 'flex';
          videoToggleBtn.textContent = '⏸ Пауза';
          videoEl.play().catch(() => {});

          let lastDraw = 0;
          const loop = (ts) => {
            if (!videoEl) return;
            if (!videoEl.paused && ts - lastDraw >= 32) {
              lastDraw = ts;
              renderFrameToAscii(videoEl, videoEl.videoWidth, videoEl.videoHeight, true);
            }
            rafId = requestAnimationFrame(loop);
          };
          rafId = requestAnimationFrame(loop);
        }, { once: true });
      } else {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            currentImg = img;
            enableOutputs();
            renderFrameToAscii(currentImg, currentImg.width, currentImg.height, false);
            fitCanvasToViewer();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    cameraInput.addEventListener('change', (e) => { handleFile(e.target.files[0]); e.target.value = ''; });
    galleryInput.addEventListener('change', (e) => { handleFile(e.target.files[0]); e.target.value = ''; });

    colsRange.addEventListener('input', () => {
      colsVal.textContent = colsRange.value;
      if (currentImg) renderFrameToAscii(currentImg, currentImg.width, currentImg.height, false);
    });

    function setMode(m) {
      colorMode = m;
      modeColorBtn.classList.toggle('active', m === 'color');
      modeMonoBtn.classList.toggle('active', m === 'mono');
      if (currentImg) renderFrameToAscii(currentImg, currentImg.width, currentImg.height, false);
    }
    modeColorBtn.addEventListener('click', () => setMode('color'));
    modeMonoBtn.addEventListener('click', () => setMode('mono'));

    videoToggleBtn.addEventListener('click', () => {
      if (!videoEl) return;
      if (videoEl.paused) {
        videoEl.play();
        videoToggleBtn.textContent = '⏸ Пауза';
      } else {
        videoEl.pause();
        videoToggleBtn.textContent = '▶ Пуск';
        renderFrameToAscii(videoEl, videoEl.videoWidth, videoEl.videoHeight, false);
      }
    });

    saveBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `ascii_${Date.now()}.png`;
      link.href = asciiCanvas.toDataURL('image/png');
      link.click();
      showToast('PNG сохранён');
    });

    copyBtn.addEventListener('click', async () => {
      if (videoEl && !currentImg) {
        renderFrameToAscii(videoEl, videoEl.videoWidth, videoEl.videoHeight, false);
      }
      if (!lastAsciiText) return;
      try {
        await navigator.clipboard.writeText(lastAsciiText);
        showToast('Символы скопированы');
      } catch {
        showToast('Не удалось скопировать');
      }
    });

    resetZoomBtn.addEventListener('click', fitCanvasToViewer);

    // Жесты сенсорного экрана (зум двумя пальцами и перетаскивание)
    function dist(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.hypot(dx, dy);
    }

    viewer.addEventListener('touchstart', (e) => {
      if (asciiCanvas.style.display === 'none') return;
      if (e.touches.length === 2) {
        isDragging = false;
        startDist = dist(e.touches[0], e.touches[1]);
        startScale = scale;
      } else if (e.touches.length === 1) {
        const now = Date.now();
        if (now - lastTap < 280) {
          fitCanvasToViewer();
          lastTap = 0;
          return;
        }
        lastTap = now;
        isDragging = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      }
    }, { passive: true });

    viewer.addEventListener('touchmove', (e) => {
      if (asciiCanvas.style.display === 'none') return;
      if (e.touches.length === 2 && startDist > 0) {
        const d = dist(e.touches[0], e.touches[1]);
        scale = Math.min(8, Math.max(0.6, startScale * (d / startDist)));
        applyTransform();
      } else if (e.touches.length === 1 && isDragging) {
        panX += e.touches[0].clientX - lastX;
        panY += e.touches[0].clientY - lastY;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        applyTransform();
      }
    }, { passive: true });

    viewer.addEventListener('touchend', () => { isDragging = false; });

    window.addEventListener('resize', () => {
      if (asciiCanvas.width > 0) fitCanvasToViewer();
    });

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
